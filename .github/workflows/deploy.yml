name: Deploy to GitHub Pages

# 배포 전용 — main 에 push 되거나 수동 실행 시 정적 export 를 빌드해 Pages 로 배포한다.
# 로컬 소스는 그대로 두고, 이 워크플로우에서만 NEXT_PUBLIC_BASE_PATH(=BASE_PATH) 를 주입해
# 서브경로 배포용으로 빌드한다. AR(8thwall)은 별도 저장소를 체크아웃해 빌드·임포트한다.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Pages 배포에 필요한 권한.
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 저장소 이름과 동일해야 함(https://<user>.github.io/<repo>/). 저장소명이 바뀌면 여기만 수정.
  BASE_PATH: /2026-07-ARQuiz-FRONT

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      # 8thwall AR(비공개) 저장소를 체크아웃해 빌드·임포트 → public/ar/shooting 생성.
      #   비공개라 기본 GITHUB_TOKEN으로는 못 받음 → 이 저장소 시크릿 AR_REPO_TOKEN(=AR 저장소 읽기 PAT) 필요.
      #   AR 저장소가 공개면 token 줄을 지워도 된다.
      - name: Checkout AR (8thwall)
        uses: actions/checkout@v4
        with:
          repository: firstfuturevision/2026-07-ARQuiz-AR
          ref: master
          path: _ar-src
          token: ${{ secrets.AR_REPO_TOKEN }}

      # sync-ar.mjs 가 _ar-src 를 빌드해 public/ar/shooting 으로 미러 복사(다음 build 단계가 out/ 에 포함).
      - name: Build & import AR bundle
        env:
          AR_SRC: ${{ github.workspace }}/_ar-src
        run: npm run sync-ar

      # Pages 최초 활성화까지 자동 처리(수동 Settings→Pages 불필요). Source=GitHub Actions.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build (static export + basePath)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}
        run: npm run build

      - name: Prefix raw asset paths for subpath serving
        run: node scripts/gh-pages-rewrite.mjs out "${{ env.BASE_PATH }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

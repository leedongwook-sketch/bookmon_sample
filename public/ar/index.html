    position: fixed; inset: 0; z-index: 5;
    background: #ffffff; opacity: 1;
    transition: opacity 0.8s ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #boot-overlay.fade-out { opacity: 0; pointer-events: none; }
  /* Tiny loading label, bottom-left. */
  #boot-overlay .loading {
    position: absolute; left: 14px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    font-size: 11px; letter-spacing: 0.3px; color: #9aa0aa;
  }
  /* Desktop / unsupported guidance — centered, shown only on non-mobile. */
  #boot-overlay .desktop-hint {
    display: none; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%); width: 320px; max-width: 80%;
    margin: 0; text-align: center; color: #4a4f57; font-size: 14px; line-height: 1.6;
  }

  /* Shot muzzle flash: a quick, clearly-visible full-screen flash on each shot.
     A bright center burst + warm edge glow reads as a gun muzzle flash. */
  #shot-flash {
    position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: 0;
    background:
      radial-gradient(circle at center, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.0) 42%),
      radial-gradient(circle at center, rgba(255,180,60,0.0) 55%, rgba(255,150,30,0.55) 100%);
  }
  #shot-flash.fire { animation: shot-flash 200ms ease-out; }
  @keyframes shot-flash { 0% { opacity: 1; } 60% { opacity: 0.7; } 100% { opacity: 0; } }

  /* Camera shake: applied to the AR canvas. The slight scale hides the edges
     that the translation would otherwise reveal. */
  canvas.cam-shake { animation: cam-shake 240ms ease-in-out; }
  canvas.cam-shake-strong { animation: cam-shake-strong 300ms ease-in-out; }
  @keyframes cam-shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-7px, 5px) scale(1.05); }
    45% { transform: translate(7px, -5px) scale(1.05); }
    70% { transform: translate(-5px, -4px) scale(1.05); }
    88% { transform: translate(4px, 4px) scale(1.04); }
  }
  @keyframes cam-shake-strong {
    0%, 100% { transform: translate(0, 0); }
    18% { transform: translate(-12px, 8px) scale(1.08); }
    38% { transform: translate(11px, -9px) scale(1.08); }
    58% { transform: translate(-9px, -6px) scale(1.07); }
    80% { transform: translate(8px, 7px) scale(1.06); }
  }

  /* ===== Game UI (HTML overlay above the AR canvas) ===================== */
  /* Driven by window.__bookmonUI from the game (shooting-game.ts). Two phases:
     'kill' (shoot the health gauge) and 'capture' (indicator mini-game). */
  #game-ui {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #xh-kill, #xh-cap { display: none; }
  #game-ui[data-phase="kill"] #xh-kill { display: block; }
  #game-ui[data-phase="capture"] #xh-cap { display: block; }
  #game-ui[data-phase="capture"] #cap-bar { display: flex; }

  /* Kill-phase crosshair (sniper reticle), centered. */
  #xh-kill {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 150px; height: auto;
  }

  /* Capture-phase reticle: viewfinder corner brackets + center circle. */
  #xh-cap {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(80vw, 460px); height: min(54vh, 420px);
  }
  #xh-cap .corner { position: absolute; width: 30px; height: 30px; border: 3px solid #fff; }
  #xh-cap .corner.tl { left: 0; top: 0; border-right: 0; border-bottom: 0; }
  #xh-cap .corner.tr { right: 0; top: 0; border-left: 0; border-bottom: 0; }
  #xh-cap .corner.bl { left: 0; bottom: 0; border-right: 0; border-top: 0; }
  #xh-cap .corner.br { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  #xh-cap-center {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 120px; height: auto;
  }

  /* Intro: radial effect (rotates, grows, fades) + "시작!" banner, ~2s. */
  #intro {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #intro.play { display: flex; }
  #intro-effect { position: absolute; width: min(92vw, 380px); height: auto; }
  #intro-start { position: absolute; width: min(74vw, 300px); height: auto; }
  #intro.play #intro-effect { animation: intro-fx 2s ease-out forwards; }
  #intro.play #intro-start { animation: intro-start 2s ease-out forwards; }
  @keyframes intro-fx {
    0%   { transform: rotate(0deg) scale(0.4); opacity: 0; }
    12%  { opacity: 0.95; }
    50%  { transform: rotate(200deg) scale(1.15); opacity: 0.8; }
    100% { transform: rotate(340deg) scale(2.0); opacity: 0; }
  }
  @keyframes intro-start {
    0%   { transform: scale(0.7); opacity: 0; }
    18%  { transform: scale(1.05); opacity: 1; }
    72%  { transform: scale(1); opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }

  /* Capture bottom bar: timer (left), gauge+indicator (center), camera (right). */
  #cap-bar {
    position: fixed; left: 0; right: 0; bottom: 0; display: none;
    align-items: center; gap: 12px;
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box; pointer-events: none;
  }
  #cap-timer {
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
    background: #16213a; color: #fff; padding: 8px 18px 8px 15px; border-radius: 999px;
    font-weight: 800; font-size: 18px; line-height: 1; white-space: nowrap;
  }
  #cap-timer .ic { width: 24px; height: 24px; display: block; flex: 0 0 auto; }
  #cap-timer .txt { display: inline-block; }
  #cap-gauge { position: relative; flex: 1 1 auto; min-width: 0; }
  #cap-gauge-img { width: 100%; height: auto; display: block; }
  #cap-indicator {
    position: absolute; bottom: 100%; left: 4%; width: 16px; height: auto;
    transform: translate(-50%, 8px); will-change: left;
  }
  #cap-indicator.miss { animation: ind-miss 0.28s ease-out; }
  @keyframes ind-miss { 0%,100% { filter: none; } 50% { filter: drop-shadow(0 0 5px #ff5a5a); } }
  #cap-camera {
    flex: 0 0 auto; pointer-events: auto; border: none; background: none; padding: 0;
    width: 62px; height: 62px; outline: none; -webkit-appearance: none; appearance: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  /* Kill the focus/active ring entirely (some browsers draw a pink/dotted
     outline around the tapped camera button). */
  #cap-camera:focus,
  #cap-camera:focus-visible,
  #cap-camera:active { outline: none; border: none; box-shadow: none; }
  #cap-camera img {
    width: 100%; height: 100%; display: block; border: none; outline: none;
    pointer-events: none; -webkit-user-drag: none; user-select: none;
  }</style><div id="boot-overlay"><span class="loading">loading...</span><p class="desktop-hint">이 콘텐츠는 <b>모바일 기기</b>의 카메라가 필요합니다.<br>휴대폰 브라우저에서 이 페이지를 열어주세요.</p></div><div id="shot-flash"></div><div id="game-ui" data-phase="none"><img id="xh-kill" src="assets/kill_white.png" alt=""><div id="xh-cap"><span class="corner tl"></span><span class="corner tr"></span> <span class="corner bl"></span><span class="corner br"></span> <img id="xh-cap-center" src="assets/cap_white.png" alt=""></div><div id="intro"><img id="intro-effect" src="assets/effect.png" alt=""> <img id="intro-start" src="assets/start.png" alt=""></div><div id="cap-bar"><div id="cap-timer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="7" fill="none" stroke="#fff" stroke-width="2"></circle><line x1="8.8" y1="2.6" x2="15.2" y2="2.6" stroke="#fff" stroke-width="2" stroke-linecap="round"></line><line x1="12" y1="2.6" x2="12" y2="5.2" stroke="#fff" stroke-width="2"></line><line x1="16.8" y1="4.4" x2="19" y2="6.6" stroke="#fff" stroke-width="2" stroke-linecap="round"></line><line x1="12" y1="14" x2="12" y2="9.4" stroke="#fff" stroke-width="2" stroke-linecap="round"></line></svg> <span class="txt"><span id="cap-secs">10</span>초</span></div><div id="cap-gauge"><img id="cap-indicator" src="assets/indicator.png" alt=""> <img id="cap-gauge-img" src="assets/gage.png" alt=""></div><button id="cap-camera" type="button" aria-label="capture"><img src="assets/cam_normal.png" alt=""></button></div></div><script>// === iframe contract ===================================================
  // Report a result to the parent page:
  //   parent.postMessage({ source:'bookmon-ar', type, payload }, '*')
  // type: 'success' | 'fail' | 'close'
  window.__bookmonSend = function (type, payload) {
    try {
      var msg = {source: 'bookmon-ar', type: type, payload: payload || {}}
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(msg, '*')
      }
    } catch (e) { /* no-op */ }
  };

  // Stop the AR engine and free device resources: releases the camera stream,
  // halts the render loop, and clears our helper interval. Safe to call twice.
  window.__bookmonStopAR = function () {
    try { if (window.__fixVideosInterval) { clearInterval(window.__fixVideosInterval); window.__fixVideosInterval = null } } catch (e) {}
    try { if (window.XR8 && XR8.stop) XR8.stop() } catch (e) {}
  };

  // === Terminal end of the experience (success / fail) ===================
  // Notifies the parent AND tears the AR session down so a finished game never
  // keeps the camera + render loop alive (battery/CPU drain). The parent is still
  // expected to REMOVE the iframe on this message — that is the real teardown;
  // the in-iframe stop below is a safety net for when it doesn't (or is slow).
  //   graceMs: keep rendering briefly (e.g. for a success effect) before stopping.
  window.__bookmonEnded = false
  window.__bookmonEnd = function (type, payload, opts) {
    if (window.__bookmonEnded) return
    window.__bookmonEnded = true
    window.__bookmonSend(type, payload)
    var graceMs = (opts && typeof opts.graceMs === 'number')
      ? opts.graceMs
      : (type === 'success' ? 2500 : 0)   // let a success effect play, fail stops now
    if (graceMs > 0) {
      setTimeout(window.__bookmonStopAR, graceMs)
    } else {
      window.__bookmonStopAR()
    }
  };

  // Content is ready: fade the white boot overlay out, then remove it — the AR
  // content shows through, appearing to fade in from white. Called from the ECS
  // side (hide-on-ready) when REALITY_READY fires. Idempotent.
  window.__bookmonReady = function () {
    var el = document.getElementById('boot-overlay')
    if (!el || el.__done) return
    el.__done = true
    el.classList.add('fade-out')
    setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el) }, 850)
  };

  // If a parent-supplied ?image= fails to load, end early as a failure.
  ;(function () {
    try {
      var imgSrc = new URLSearchParams(location.search).get('image')
      if (imgSrc) {
        var probe = new Image()
        probe.onerror = function () {
          window.__bookmonEnd('fail', {reason: 'image_load_failed', image: imgSrc})
        }
        probe.src = imgSrc
      }
    } catch (e2) { /* no-op */ }
  })()

  // Show the desktop guidance when this isn't a touch/mobile device (world AR is
  // disabled on desktop by the camera config). On mobile, arm a safety fallback so
  // a missed REALITY_READY never traps the user on the white loading screen.
  ;(function () {
    var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (('ontouchstart' in window) && navigator.maxTouchPoints > 1)
    if (!isMobile) {
      var hint = document.querySelector('#boot-overlay .desktop-hint')
      if (hint) hint.style.display = 'block'
    } else {
      setTimeout(function () { if (window.__bookmonReady) window.__bookmonReady() }, 15000)
    }
  })()

  // Shot effect: muzzle flash + camera shake. Called from the game (shooting-game.ts)
  // on every shot; `strong` = a confirmed hit (bigger shake). The flash keeps its
  // CSS muzzle-flash gradient — we only (re)trigger the animation.
  window.__shotFx = function (color, strong) {
    window.__shotCount = (window.__shotCount || 0) + 1
    var fl = document.getElementById('shot-flash')
    if (fl) {
      fl.classList.remove('fire')
      void fl.offsetWidth          // force reflow so the animation retriggers
      fl.classList.add('fire')
    }
    var c = document.querySelector('canvas')
    if (c) {
      var cls = strong ? 'cam-shake-strong' : 'cam-shake'
      c.classList.remove('cam-shake')
      c.classList.remove('cam-shake-strong')
      void c.offsetWidth
      c.classList.add(cls)
    }
  }

  // === Game UI controller ================================================
  // Drives the HTML crosshairs, intro animation, and the capture mini-game.
  // Called by the game (shooting-game.ts):
  //   __bookmonUI.setPhase('kill'|'capture'|'none')
  //   __bookmonUI.setLock(bool)          // recolor current reticle (green when aimed)
  //   __bookmonUI.playIntro()            // effect + "시작!" (~2s)
  //   __bookmonUI.startCapture({seconds, greenStart, greenEnd, onCapture, onTimeout})
  //   __bookmonUI.stopCapture()
  window.__bookmonUI = (function () {
    var ui = document.getElementById('game-ui')
    var xhKill = document.getElementById('xh-kill')
    var capCenter = document.getElementById('xh-cap-center')
    var secsEl = document.getElementById('cap-secs')
    var indicator = document.getElementById('cap-indicator')
    var camBtn = document.getElementById('cap-camera')
    var camImg = camBtn ? camBtn.querySelector('img') : null
    var intro = document.getElementById('intro')

    var phase = 'none'
    var locked = false
    var GREEN0 = 0.336, GREEN1 = 0.664   // green zone as fraction of the gauge width
    var raf = null
    var cap = null                        // active capture session

    function now() { return (window.performance && performance.now) ? performance.now() : (+new Date()) }

    function setPhase(p) {
      phase = p
      if (ui) ui.setAttribute('data-phase', p)
      setLock(false)
      if (p !== 'capture') stopCapture()
    }
    function setLock(v) {
      locked = !!v
      if (phase === 'kill' && xhKill) {
        xhKill.src = locked ? 'assets/kill_green.png' : 'assets/kill_white.png'
      } else if (phase === 'capture' && capCenter) {
        capCenter.src = locked ? 'assets/cap_green.png' : 'assets/cap_white.png'
      }
    }
    function playIntro() {
      if (!intro) return
      intro.classList.remove('play')
      void intro.offsetWidth            // restart the animation
      intro.classList.add('play')
    }

    function startCapture(opts) {
      stopCapture()
      opts = opts || {}
      GREEN0 = (opts.greenStart != null) ? opts.greenStart : GREEN0
      GREEN1 = (opts.greenEnd != null) ? opts.greenEnd : GREEN1
      var seconds = opts.seconds || 10
      var t0 = now(), endAt = t0 + seconds * 1000
      var period = opts.period || 1400   // indicator ping-pong period (ms)
      if (secsEl) secsEl.textContent = seconds
      cap = {frac: 0, done: false, onCapture: opts.onCapture, onTimeout: opts.onTimeout}

      function tick() {
        if (!cap || cap.done) return
        var t = now()
        var ph = ((t - t0) % period) / period      // 0..1
        var tri = ph < 0.5 ? ph * 2 : (1 - ph) * 2 // 0..1..0 triangle
        var frac = 0.04 + tri * 0.92               // travel 4%..96%
        cap.frac = frac
        if (indicator) indicator.style.left = (frac * 100) + '%'
        var remain = Math.max(0, Math.ceil((endAt - t) / 1000))
        if (secsEl) secsEl.textContent = remain
        if (t >= endAt) {
          var cb = cap.onTimeout; cap.done = true; cap = null
          if (cb) cb()
          return
        }
        raf = requestAnimationFrame(tick)
      }
      raf = requestAnimationFrame(tick)
    }
    function stopCapture() {
      if (raf) { cancelAnimationFrame(raf); raf = null }
      cap = null
    }
    function tryCapture() {
      if (!cap || cap.done) return
      var inGreen = cap.frac >= GREEN0 && cap.frac <= GREEN1
      if (inGreen && locked) {
        var cb = cap.onCapture; cap.done = true; stopCapture()
        if (cb) cb()
      } else if (indicator) {
        indicator.classList.remove('miss')
        void indicator.offsetWidth
        indicator.classList.add('miss')
      }
    }

    if (camBtn) {
      camBtn.addEventListener('pointerdown', function () { if (camImg) camImg.src = 'assets/cam_press.png' })
      var release = function () { if (camImg) camImg.src = 'assets/cam_normal.png' }
      camBtn.addEventListener('pointerup', release)
      camBtn.addEventListener('pointerleave', release)
      camBtn.addEventListener('pointercancel', release)
      camBtn.addEventListener('click', function (e) { e.stopPropagation(); tryCapture() })
    }

    return {
      setPhase: setPhase, setLock: setLock, playIntro: playIntro,
      startCapture: startCapture, stopCapture: stopCapture,
    }
  })()</script><script src="bundle.js"></script></body></html>
